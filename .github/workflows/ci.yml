# Every pull request and every push to main, on Windows, Linux and macOS: typecheck, lint, every unit test and the
# publish guard, then the built app started once in its frozen demo and the stable copy (the staged release) started
# with a new profile (all steps of `check`). A pull request also runs the branch gate (README and doc freshness) and
# captures the hidden dev demo for visual review. Windows main then proves the exact offline installer before upload.
# The e2e suite is never a gate (docs/agents/rules.md §7): it runs only when the owner starts this workflow by hand
# with `e2e` ticked. No live/token-spending tests; publishing remains a manual workflow and a draft review.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the e2e suite (Linux, read against test/e2e/known-red.json)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm run setup
      - name: Main reference for branch gate
        if: github.event_name == 'pull_request'
        shell: bash
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - name: Branch gate (README and doc freshness, guard on the changed files)
        if: github.event_name == 'pull_request'
        run: npm run check:branch
      - name: Every unit test
        if: github.event_name == 'pull_request' && !cancelled()
        run: npx vitest run
      - name: Main gate (typecheck, lint, every unit test, publish guard; no e2e)
        if: github.event_name != 'pull_request'
        run: npm run check -- --no-e2e
      - name: Electron's system libraries (Linux)
        if: runner.os == 'Linux' && !cancelled()
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64
      # the proof that the app starts on this OS (ADR 0054 stage 5): frozen demo, every sidebar page, a clean quit
      - name: Build the app
        if: ${{ !cancelled() }}
        run: node scripts/build.mjs --dev
      - name: Start the app once (Linux)
        if: runner.os == 'Linux' && !cancelled()
        env:
          SB_E2E_ELECTRON_ARGS: --use-angle=swiftshader --enable-unsafe-swiftshader
        run: xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" node scripts/boot-smoke.mjs
      - name: Start the app once
        if: runner.os != 'Linux' && !cancelled()
        run: node scripts/boot-smoke.mjs
      # the release as the user gets it: staged in a temp folder with its own Electron copy, a new profile, a brain
      # chosen with the app's own button. The proof that the stable copy starts on this OS too
      - name: Stable copy (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" npm run test:stable
      - name: Stable copy
        if: runner.os != 'Linux'
        run: npm run test:stable
      - name: Build offline Windows installer
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        run: npm run package:windows
      - name: Install and launch without system Node
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        run: npm run test:installer
      - name: Verified Windows installer
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: test-results/installer/dist/
          if-no-files-found: error
          retention-days: 14
      - name: screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-results/boot-smoke/
            test-results/shots/
            test-results/installer-smoke/
            test-results/stable/
          if-no-files-found: ignore
          retention-days: 7

  # The e2e suite, only by hand (the owner's rule: never a gate). Its verdict is read against test/e2e/known-red.json.
  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64
      - run: npm run setup
      - name: Full check with the e2e suite
        env:
          SB_E2E_ELECTRON_ARGS: --use-angle=swiftshader --enable-unsafe-swiftshader
        run: xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" npm run check
      - name: screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: test-results/shots/
          if-no-files-found: ignore
          retention-days: 7

  # A dev-app visual inspection artifact, independent of the by-hand E2E suite.
  dev-visual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Hidden Electron system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64
      - run: npm run setup
      - name: Build dev app
        run: node scripts/build.mjs --dev
      - name: Capture frozen dev app (no E2E suite, no live providers)
        run: xvfb-run --auto-servernum -s "-screen 0 1920x1200x24" node scripts/dev-visual-smoke.mjs
      - name: Dev visual review images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-visual-smoke
          path: test-results/dev-visual-smoke/
          if-no-files-found: error
          retention-days: 14

  # Opt-in hidden renderer profiling for performance branches; synthetic data, no E2E or providers.
  renderer-profile:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/renderer-throughput-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64
      - run: npm run setup
      - name: Build baseline and candidate with identical dependencies
        env:
          PROFILE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add ../renderer-baseline "$PROFILE_BASE"
          ln -s "$PWD/node_modules" ../renderer-baseline/node_modules
          (cd ../renderer-baseline && node scripts/build.mjs --dev)
          node scripts/build.mjs --dev
      - name: Profile both hidden renderers on the same runner
        run: |
          xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" node scripts/profile-renderer.mjs --app-root ../renderer-baseline --label baseline --seconds 360
          xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" node scripts/profile-renderer.mjs --label candidate --seconds 360
      - name: Raw profiles and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer-profile
          path: test-results/renderer-profile/
          if-no-files-found: error
          retention-days: 14

  # The guard (ADR 0061), the last net for a PC without the hooks: tools/guard/scan.mjs on the checkout and on every
  # commit that leads to it (blobs, messages, authors), built-in rules only: a private deny list is never uploaded.
  # Only the ancestors of the commit under check: other branches and the archived pre-1.0 history are not what this
  # push publishes. No npm install: the scanner has no dependencies. Exit 2 = findings (file:line + rule, never the value).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Scan every real ancestor of the PR head, excluding GitHub's synthetic merge identity.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - name: The checkout
        run: node tools/guard/scan.mjs .
      - name: Every commit that leads to it
        run: |
          git rev-list HEAD > "$RUNNER_TEMP/commits.txt"
          node tools/guard/scan.mjs . --commits "$RUNNER_TEMP/commits.txt" --published
