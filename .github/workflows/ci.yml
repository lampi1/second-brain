# Branches run check:branch, main runs check on all platforms. Windows main then proves stable and the exact offline
# installer before upload. PRs also capture the hidden dev demo for visual review, outside the E2E suite.
# No live/token-spending tests; publishing remains a manual workflow and a draft review.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Electron's system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64
      - run: npm run setup
      - name: Main reference for branch gate
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        shell: bash
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - name: Branch gate (no e2e)
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: npm run check:branch
      - name: Main gate (Linux)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && runner.os == 'Linux'
        run: xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" npm run check
      - name: Main gate
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && runner.os != 'Linux'
        run: npm run check
      - name: Stable copy (synthetic home, real auto-discovery)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && runner.os == 'Windows'
        run: npm run test:stable
      - name: Build offline Windows installer
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && runner.os == 'Windows'
        run: npm run package:windows
      - name: Install and launch without system Node
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && runner.os == 'Windows'
        run: npm run test:installer
      - name: Verified Windows installer
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: test-results/installer/dist/
          if-no-files-found: error
          retention-days: 14
      - name: screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-results/shots/
            test-results/installer-smoke/
            test-results/stable/
          if-no-files-found: ignore
          retention-days: 7

  # A dev-app visual inspection artifact, independent of the main-only E2E suite.
  dev-visual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Hidden Electron system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64
      - run: npm run setup
      - name: Build dev app
        run: node scripts/build.mjs --dev
      - name: Build terminal CLI and install its browser for the live view proof
        run: |
          node packages/routine-runtime/scripts/build.mjs
          npx playwright install chromium
      - name: Capture frozen dev app (no E2E suite, no live providers)
        run: xvfb-run --auto-servernum -s "-screen 0 1920x1200x24" node scripts/dev-visual-smoke.mjs
      - name: Dev visual review images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-visual-smoke
          path: test-results/dev-visual-smoke/
          if-no-files-found: error
          retention-days: 14

  # Opt-in hidden renderer profiling for performance branches; synthetic data, no E2E or providers.
  renderer-profile:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/renderer-throughput-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64
      - run: npm run setup
      - name: Build baseline and candidate with identical dependencies
        env:
          PROFILE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add ../renderer-baseline "$PROFILE_BASE"
          ln -s "$PWD/node_modules" ../renderer-baseline/node_modules
          (cd ../renderer-baseline && node scripts/build.mjs --dev)
          node scripts/build.mjs --dev
      - name: Profile both hidden renderers on the same runner
        run: |
          xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" node scripts/profile-renderer.mjs --app-root ../renderer-baseline --label baseline --seconds 360
          xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" node scripts/profile-renderer.mjs --label candidate --seconds 360
      - name: Raw profiles and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer-profile
          path: test-results/renderer-profile/
          if-no-files-found: error
          retention-days: 14

  # The guard (ADR 0061), the last net for a PC without the hooks: tools/guard/scan.mjs on the checkout and on every
  # commit of the history (blobs, messages, authors), built-in rules only: a private deny list is never uploaded. No
  # npm install: the scanner has no dependencies. Exit 2 = findings (file:line + rule, never the value).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Scan every real ancestor of the PR head, excluding GitHub's synthetic merge identity.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - run: node tools/guard/scan.mjs . --history
