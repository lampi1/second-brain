# Manual owner workflow: repeats CI and creates a draft containing only the exact tested Windows installer.
name: Windows release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on the selected main commit (for example v0.1.0)
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer
          path: test-results/installer/dist
      - name: Validate tag, commit and bytes; create draft
        run: node scripts/publish-windows.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
