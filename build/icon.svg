<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#4f6bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
  <!-- a small network: the brain's pieces linked, one hub -->
  <g stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity="0.9">
    <line x1="128" y1="128" x2="72" y2="82"/>
    <line x1="128" y1="128" x2="186" y2="78"/>
    <line x1="128" y1="128" x2="78" y2="180"/>
    <line x1="128" y1="128" x2="182" y2="182"/>
    <line x1="72" y1="82" x2="186" y2="78" opacity="0.45"/>
  </g>
  <g fill="#ffffff">
    <circle cx="72" cy="82" r="17"/>
    <circle cx="186" cy="78" r="15"/>
    <circle cx="78" cy="180" r="15"/>
    <circle cx="182" cy="182" r="17"/>
  </g>
  <circle cx="128" cy="128" r="30" fill="#ffffff"/>
  <circle cx="128" cy="128" r="14" fill="#6d5cff"/>
</svg>
